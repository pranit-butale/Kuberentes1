apiVersion: v1
kind: ReplicationController
metadata:
  name: my-rc
  labels:
    app: auth-app
#pod portion
spec:
  template:
    metadata:
      name: my-pod
      labels:
        app: auth-app
        #container portion  
    spec:
      containers:
        - name: my-cont-4
          image: httpd
          ports:
            - containerPort: 80
  replicas: 4
  selector:
    app: auth-app
